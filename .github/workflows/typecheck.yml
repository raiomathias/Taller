name: TypeScript checks
on:
  push:
    branches: [main]
    paths:
      - 'src/**'
      - '*.json'
      - 'tsconfig*.json'
      - '.github/workflows/typecheck.yml'
      - 'scripts/**'
  pull_request:
    branches: [main]
  workflow_dispatch:
jobs:
  typecheck:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Install dependencies
        run: npm install
      - name: Report dependency vulnerabilities
        run: npm audit --json > npm-audit.json || true
      - name: Print dependency audit summary
        run: node scripts/audit-summary.mjs
      - name: Check TypeScript
        run: npm run typecheck