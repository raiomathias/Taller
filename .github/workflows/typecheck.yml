name: TypeScript checks
on:
  push:
    branches: [main]
    paths:
      - 'src/**'
      - '*.json'
      - 'tsconfig*.json'
      - '.github/workflows/typecheck.yml'
  pull_request:
    branches: [main]
  workflow_dispatch:
jobs:
  typecheck:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Install dependencies
        run: npm install
      - name: Report dependency vulnerabilities
        run: npm audit --json > npm-audit.json || true
      - name: Print dependency audit summary
        run: node -e "const a=require('./npm-audit.json'); for (const [name,v] of Object.entries(a.vulnerabilities||{})) console.log(name+': '+v.severity+' | '+(v.fixAvailable?'fix available':'no automatic fix'))"
      - name: Check TypeScript
        run: npm run typecheck